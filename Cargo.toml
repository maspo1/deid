[package]
name = "deid"
version = "0.1.0"
edition = "2021"
description = "파일 속 개인정보와 민감정보를 찾아 비식별화하는 오프라인 도구"

[dependencies]
aho-corasick = "1.1.5"
crc32fast = "1.5.5"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "ico", "tiff"] }
lopdf = "0.36.0"
rayon = "1.12.0"
regex = "1.13.1"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
